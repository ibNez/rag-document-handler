services:
  webui:
    build: .
    ports:
      - "${FLASK_PORT:-3000}:${FLASK_PORT:-3000}"
    volumes:
      - ./${LOG_DIR:-logs}:/app/logs
      - ./${UPLOAD_FOLDER:-staging}:/app/staging
      - ./${DELETED_FOLDER:-deleted}:/app/deleted
      - ./${UPLOADED_FOLDER:-uploaded}:/app/uploaded
      - ./${SNAPSHOT_DIR:-snapshots}:/app/snapshots
      - ./${EMAIL_ATTACHMENTS_DIR:-email_attachments}:/app/email_attachments
      - ./ssl:/app/ssl
    env_file:
      - .env
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rag_metadata}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OLLAMA_EMBEDDING_HOST: ollama
      OLLAMA_EMBEDDING_PORT: 11434
      OLLAMA_CLASSIFICATION_HOST: ollama
      OLLAMA_CLASSIFICATION_PORT: 11434
      OLLAMA_CHAT_HOST: ollama
      OLLAMA_CHAT_PORT: 11434
      OLLAMA_API_BASE: http://ollama:11434
      LOG_DIR: /app/logs

  milvus:
    image: milvusdb/milvus:v2.4.13
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - ./databases/milvus/db:/var/lib/milvus
      - ./${LOG_DIR:-logs}/milvus:/var/log/milvus
    environment:
      ETCD_USE_EMBED: true
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    command: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  postgres:
    image: postgres:15
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./databases/postgres:/var/lib/postgresql/data
      - ./${LOG_DIR:-logs}/postgres:/var/log/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_metadata}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_CHAT_PORT:-11434}:11434"
    volumes:
      - ./containers/ollama:/root/.ollama
      - ./${LOG_DIR:-logs}/ollama:/var/log/ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
